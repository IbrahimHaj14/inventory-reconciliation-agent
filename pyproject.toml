[project]
name = "inventory-reconciliation-agent"
version = "0.1.0"
description = "Deterministic multi-source inventory reconciliation agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]

[project.scripts]
reconcile = "reconciler.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconciler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["reconciler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
